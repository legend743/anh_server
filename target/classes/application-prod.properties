# Production Server
server.address=127.0.0.1
server.port=${PORT:8080}

# Production MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Production Database Schema
spring.jpa.hibernate.ddl-auto=update

# Production JWT Secrets
security.jwt.secret-key=${JWT_SECRET}
jwt.secret=${JWT_SECRET}

# Production Image Storage
image.upload.dir=/opt/myapp/uploads

# Production Image URL
image.base.url=${IMAGE_BASE_URL}

# Production Logging
logging.level.com.ahujanursinghome=INFO