# Local Server
server.address=127.0.0.1
server.port=${PORT:8080}

# Local MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Local Database Schema
spring.jpa.hibernate.ddl-auto=update

# Local JWT Secrets
security.jwt.secret-key=${JWT_SECRET}
jwt.secret=${JWT_SECRET}

# Local Image Storage
image.upload.dir=D:/apache-tomcat-10.1.42/webapps/ROOT/assets

# Local Image URL
image.base.url=http://localhost:8080/uploads/