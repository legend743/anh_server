spring.application.name=AhujaNursingHome
spring.port=${PORT:8080}
server.servlet.context-path=/api
# DATABASE CONFIGURATION (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Connection Pool Settings (HikariCP)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ===============================
# JPA/HIBERNATE CONFIGURATION
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# SECURITY CONFIGURATION (JWT)
# ===============================
security.jwt.secret-key=your-secret-key
security.jwt.expiration-time=86400000  # Token expires in 24 hours (in milliseconds)

# ===============================
# LOGGING CONFIGURATION
# ===============================
logging.level.org.springframework=INFO
logging.level.com.ahujanursinghome=DEBUG
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
# Enable multipart file upload
spring.servlet.multipart.enabled=true

# Increase max file size (change this based on your needs)
image.upload.dir=D:/apache-tomcat-10.1.42/webapps/ROOT/assets
# Public URL prefix for serving images
image.base.url=http://localhost:8080/uploads/
spring.jpa.open-in-view=false
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER
