
name: Build and Deploy Spring Boot App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.9'

      - name: Build WAR
        run: mvn clean package -DskipTests

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Copy WAR to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          WAR_FILE=$(find target -maxdepth 1 -type f -name '*.war' ! -name '*.original' | head -n 1)
          test -n "$WAR_FILE"
          scp -i ~/.ssh/deploy_key "$WAR_FILE" \
            "$EC2_USER@$EC2_HOST:/home/ubuntu/app-new.war"

      - name: Deploy and restart application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" '
            sudo install -o ubuntu -g ubuntu -m 644 /home/ubuntu/app-new.war /opt/myapp/app.jar &&
            sudo systemctl restart myapp &&
            sudo systemctl --no-pager --full status myapp
          '
